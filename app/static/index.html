<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VeriSor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Recursive:slnt,wght,CASL,CRSV,MONO@-15..0,300..1000,0..1,0..1,0..1&display=swap" rel="stylesheet">
<style>
  :root {
    --kagit: #F4F7F9;
    --kare: #D8E2EA;
    --murekkep: #1E3A9E;
    --kursun: #24272C;
    --soluk: #5A6069;
    --fosfor: #F3E37C;
    --kirmizi: #C23B2A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background-color: var(--kagit);
    background-image:
      linear-gradient(var(--kare) 1px, transparent 1px),
      linear-gradient(90deg, var(--kare) 1px, transparent 1px);
    background-size: 24px 24px;
    color: var(--kursun);
    font-family: "Recursive", system-ui, sans-serif;
    font-variation-settings: "CASL" 0, "MONO" 0;
    font-size: 17px;
    line-height: 1.5;
  }
  .sayfa {
    position: relative;
    max-width: 840px;
    min-height: 100vh;
    margin: 0 auto;
    padding: 48px 24px 96px 80px;
  }
  .sayfa::before {
    content: "";
    position: absolute;
    top: 0; bottom: 0; left: 52px;
    width: 2px;
    background: var(--kirmizi);
    opacity: .5;
  }
  .gizli { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  header h1 { margin: 0; font-size: 1.3rem; font-weight: 800; }
  header p { margin: .3rem 0 0; color: var(--soluk); max-width: 62ch; }

  form { margin-top: 48px; }
  .satir {
    display: flex; gap: 16px; align-items: flex-end;
    border-bottom: 2px solid var(--kursun);
  }
  .satir:focus-within { border-bottom-color: var(--murekkep); }
  #soru {
    flex: 1; min-width: 0;
    border: 0; outline: none; background: transparent;
    font: inherit; font-size: 1.6rem;
    font-variation-settings: "CASL" 1, "MONO" 0;
    color: var(--murekkep);
    padding: 8px 0;
  }
  #soru::placeholder { color: #8C97A3; }
  .gonder {
    margin-bottom: 8px; padding: 10px 22px;
    border: 0; border-radius: 3px;
    background: var(--murekkep); color: #fff;
    font: inherit; font-weight: 700; cursor: pointer;
  }
  .gonder:disabled { opacity: .65; cursor: wait; }

  .ornekler { margin-top: 18px; color: var(--soluk); font-size: .95rem; }
  .ornekler p { margin: 0 0 .3rem; }
  .ornek {
    margin: 0 1.1em .3em 0; padding: 0;
    border: 0; background: none;
    font: inherit; font-weight: 400;
    font-variation-settings: "CASL" 1, "MONO" 0;
    color: var(--murekkep); cursor: pointer;
    text-decoration: underline; text-decoration-color: #9DB0C4; text-underline-offset: 4px;
  }
  .ornek:hover { text-decoration-color: var(--murekkep); }

  :focus-visible { outline: 3px solid var(--fosfor); outline-offset: 2px; }

  .kayit { margin-top: 56px; }
  .kayit h2 {
    margin: 0; font-size: 1.35rem; font-weight: 500;
    font-variation-settings: "CASL" 1, "MONO" 0;
    color: var(--murekkep);
  }
  .bilgi { margin: .25rem 0 1rem; color: var(--soluk); font-size: .9rem; }

  .tek-deger { margin: .5rem 0; }
  .tek-deger strong {
    font-size: 2.8rem; font-weight: 800; font-variant-numeric: tabular-nums;
    padding: 0 .12em;
    background: linear-gradient(transparent 52%, var(--fosfor) 52%, var(--fosfor) 88%, transparent 88%);
  }
  .tek-deger span { display: block; color: var(--soluk); font-size: .9rem; }

  .tablo-kap { overflow-x: auto; }
  table {
    width: 100%; border-collapse: collapse;
    background: rgba(244, 247, 249, .9);
    font-size: .95rem; font-variant-numeric: tabular-nums;
  }
  th { text-align: left; font-weight: 700; border-bottom: 2px solid var(--kursun); padding: 6px 14px 6px 0; }
  td { border-bottom: 1px solid var(--kare); padding: 6px 14px 6px 0; }
  .sayi { text-align: right; }
  .not { color: var(--soluk); font-size: .9rem; }

  .hata {
    margin: .5rem 0; padding-left: 12px;
    border-left: 3px solid var(--kirmizi);
    color: var(--kirmizi);
    font-variation-settings: "CASL" 1, "MONO" 0;
  }

  details { margin-top: 1rem; }
  summary { cursor: pointer; color: var(--murekkep); font-weight: 600; }
  pre {
    margin: .6rem 0; padding: 12px 14px;
    background: #fff; border: 1px solid var(--kare);
    font-family: inherit; font-variation-settings: "CASL" 0, "MONO" 1;
    font-size: .86rem; line-height: 1.45;
    overflow-x: auto; white-space: pre;
  }
  details ul { margin: .3rem 0 0; padding-left: 1.2em; color: var(--soluk); }

  .bekle { height: 2px; margin-top: .6rem; background: var(--murekkep); width: 0; animation: ciz 1.6s ease-in-out infinite; }
  @keyframes ciz { 0% { width: 0; opacity: 1; } 70% { width: 100%; opacity: 1; } 100% { width: 100%; opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .bekle { animation: none; width: 100%; opacity: .4; } }

  @media (max-width: 600px) {
    .sayfa { padding: 32px 16px 64px 44px; }
    .sayfa::before { left: 26px; }
    #soru { font-size: 1.25rem; }
    .tek-deger strong { font-size: 2.1rem; }
  }

  .grafik { margin: 1rem 0; padding: 12px 12px 6px; background: rgba(255, 255, 255, .75); border: 1px solid var(--kare); }
  .grafik svg { display: block; }
  .grafik figcaption { margin-top: 4px; color: var(--soluk); font-size: .85rem; }
  .g-etiket { font: 12px "Recursive", sans-serif; fill: var(--kursun); }
  .g-deger { font: 11px "Recursive", sans-serif; fill: var(--soluk); font-variant-numeric: tabular-nums; }
  .g-cubuk { fill: var(--murekkep); }
  .g-cizgi { fill: none; stroke: var(--murekkep); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
  .g-nokta { fill: var(--murekkep); }
  .g-izgara { stroke: var(--kare); stroke-width: 1; }
  .indir {
    margin-top: .7rem; padding: 6px 12px;
    border: 1px solid var(--murekkep); border-radius: 3px;
    background: transparent; color: var(--murekkep);
    font: inherit; font-size: .9rem; cursor: pointer;
  }
  .indir:hover { background: rgba(30, 58, 158, .06); }

  .havuz { margin: .6rem 0 0; color: var(--soluk); font-size: .85rem; }
  .degerlendir {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
    margin-top: 1.1rem; color: var(--soluk); font-size: .95rem;
  }
  .secim {
    padding: 4px 16px;
    border: 1px solid var(--kursun); border-radius: 3px;
    background: transparent; color: var(--kursun);
    font: inherit; cursor: pointer;
  }
  .secim:hover { border-color: var(--murekkep); color: var(--murekkep); }
  .secim:disabled { opacity: .5; cursor: wait; }
  .karar { font-variation-settings: "CASL" 1, "MONO" 0; }
  .karar.onay { color: var(--murekkep); }
  .karar.ret { color: var(--kursun); }
  .karar.sorun { color: var(--kirmizi); }
</style>
</head>
<body>
<main class="sayfa">
  <header>
    <h1>VeriSor</h1>
    <p>Satış verine Türkçe soru sor. Cevabı tablo olarak, nasıl hesaplandığıyla birlikte görürsün.
       Veri: Olist e-ticaret siparişleri, 2016–2018. Veritabanına yalnızca okuma erişimi var.</p>
    <p class="havuz" id="havuz"></p>
  </header>

  <form id="form">
    <label for="soru" class="gizli">Sorun</label>
    <div class="satir">
      <input id="soru" name="soru" autocomplete="off" minlength="3" maxlength="500" required
             placeholder="Geçen yıl en çok ciro yapan kategori hangisi?">
      <button class="gonder" type="submit">Sor</button>
    </div>
    <div class="ornekler">
      <p>Şunlardan birini deneyebilirsin:</p>
      <button type="button" class="ornek">2017'nin son çeyreğinde toplam ciro ne kadar?</button>
      <button type="button" class="ornek">Ciroya göre en iyi 5 satıcı eyaleti hangileri?</button>
      <button type="button" class="ornek">Eyaletlere göre müşteri sayısı nedir?</button>
      <button type="button" class="ornek">Müşteriler kaç farklı eyalette bulunuyor?</button>
    </div>
  </form>

  <section id="kayitlar" aria-live="polite"></section>
</main>

<script>
  const form = document.getElementById("form");
  const girdi = document.getElementById("soru");
  const gonder = form.querySelector(".gonder");
  const kayitlar = document.getElementById("kayitlar");
  const sayiBicim = new Intl.NumberFormat("tr-TR", { maximumFractionDigits: 2 });

  function el(etiket, sinif, metin) {
    const e = document.createElement(etiket);
    if (sinif) e.className = sinif;
    if (metin !== undefined) e.textContent = metin;
    return e;
  }

  function bicimle(v) {
    if (v === null || v === undefined) return "—";
    if (typeof v === "number") return sayiBicim.format(v);
    if (typeof v === "string" && /^\d{4}-\d{2}-\d{2}T00:00:00$/.test(v)) return v.slice(0, 10);
    return String(v);
  }

  function nasilHesaplandi(cevap) {
    const d = el("details");
    d.append(el("summary", null, "Nasıl hesaplandı?"));
    d.append(el("pre", null, cevap.sql || ""));
    if (cevap.benzer_ornekler && cevap.benzer_ornekler.length) {
      const onay = cevap.onayli_ornek_sayisi ? ` (${cevap.onayli_ornek_sayisi} tanesi senin onayladığın cevaplardan)` : "";
      d.append(el("p", "not", "Model şu benzer sorulardan yararlandı" + onay + ":"));
      const ul = el("ul");
      cevap.benzer_ornekler.forEach(s => ul.append(el("li", null, s)));
      d.append(ul);
    }
    return d;
  }

  
  const SVGNS = "http://www.w3.org/2000/svg";
  function s(etiket, ozellik, metin) {
    const e = document.createElementNS(SVGNS, etiket);
    for (const [k, v] of Object.entries(ozellik || {})) e.setAttribute(k, v);
    if (metin !== undefined) e.textContent = metin;
    return e;
  }

  function cubukGrafik(etiket, deger) {
    if (deger.some(v => v < 0)) return null;
    const G = 720, sol = 190, sag = 90, satirH = 26;
    const H = etiket.length * satirH + 8;
    const max = Math.max(...deger) || 1;
    const svg = s("svg", { viewBox: `0 0 ${G} ${H}`, width: "100%" });
    etiket.forEach((et, i) => {
      const y = 4 + i * satirH;
      const w = (G - sol - sag) * deger[i] / max;
      const kisa = et.length > 24 ? et.slice(0, 23) + "…" : et;
      svg.append(s("text", { x: sol - 10, y: y + 17, "text-anchor": "end", class: "g-etiket" }, kisa));
      svg.append(s("rect", { x: sol, y: y + 4, width: Math.max(w, 1), height: 16, rx: 2, class: "g-cubuk" }));
      svg.append(s("text", { x: sol + w + 8, y: y + 17, class: "g-deger" }, sayiBicim.format(deger[i])));
    });
    return svg;
  }

  function cizgiGrafik(etiket, deger) {
    const G = 720, H = 260, sol = 72, sag = 24, ust = 16, alt = 36;
    const min = Math.min(0, ...deger), max = Math.max(...deger);
    const aralik = (max - min) || 1, n = deger.length;
    const x = i => sol + (G - sol - sag) * (n === 1 ? 0.5 : i / (n - 1));
    const y = v => ust + (H - ust - alt) * (1 - (v - min) / aralik);
    const svg = s("svg", { viewBox: `0 0 ${G} ${H}`, width: "100%" });
    [0, 0.5, 1].forEach(o => {
      const v = min + aralik * o;
      svg.append(s("line", { x1: sol, x2: G - sag, y1: y(v), y2: y(v), class: "g-izgara" }));
      svg.append(s("text", { x: sol - 8, y: y(v) + 4, "text-anchor": "end", class: "g-deger" }, sayiBicim.format(v)));
    });
    svg.append(s("polyline", { points: deger.map((v, i) => `${x(i)},${y(v)}`).join(" "), class: "g-cizgi" }));
    deger.forEach((v, i) => {
      const nokta = s("circle", { cx: x(i), cy: y(v), r: 3.5, class: "g-nokta" });
      nokta.append(s("title", {}, `${etiket[i]}: ${sayiBicim.format(v)}`));
      svg.append(nokta);
    });
    const adim = Math.ceil(n / 6);
    etiket.forEach((et, i) => {
      if (i % adim === 0 || i === n - 1) {
        svg.append(s("text", { x: x(i), y: H - 12, "text-anchor": "middle", class: "g-etiket" }, et.slice(0, 7)));
      }
    });
    return svg;
  }

  function grafikCiz(cevap) {
    const { kolonlar, satirlar } = cevap;
    if (kolonlar.length < 2 || satirlar.length < 2 || satirlar.length > 60) return null;
    const sayisal = kolonlar.map((_, i) => satirlar.every(r => r[i] === null || typeof r[i] === "number"));
    let eI = sayisal.findIndex(v => !v), dI;
    if (eI === -1) { eI = 0; dI = 1; } else { dI = sayisal.findIndex(v => v); }
    if (dI === -1) return null;
    const etiket = satirlar.map(r => bicimle(r[eI]));
    const deger = satirlar.map(r => (typeof r[dI] === "number" ? r[dI] : 0));
    const zaman = satirlar.every(r => typeof r[eI] === "string" && /^\d{4}-\d{2}/.test(r[eI]));
    const svg = zaman ? cizgiGrafik(etiket, deger) : cubukGrafik(etiket, deger);
    if (!svg) return null;
    svg.setAttribute("role", "img");
    svg.setAttribute("aria-label", `${kolonlar[dI]} grafiği`);
    const kap = el("figure", "grafik");
    kap.append(svg);
    kap.append(el("figcaption", null, `${kolonlar[dI]}, ${kolonlar[eI]} bazında`));
    return kap;
  }

  function csvIndir(cevap) {
    const hucre = v => {
      if (v === null || v === undefined) return "";
      if (typeof v === "number") return String(v).replace(".", ",");
      const t = String(v);
      return /[;"\n]/.test(t) ? `"${t.replace(/"/g, '""')}"` : t;
    };
    const satirlar = [cevap.kolonlar, ...cevap.satirlar].map(r => r.map(hucre).join(";"));
    const blob = new Blob(["\ufeff" + satirlar.join("\r\n")], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "verisor_" + cevap.soru.toLocaleLowerCase("tr").replace(/[^a-z0-9çğıöşü]+/g, "_").slice(0, 40) + ".csv";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  function indirmeDugmesi(cevap) {
    const b = el("button", "indir", "Excel için indir (CSV)");
    b.type = "button";
    b.addEventListener("click", () => csvIndir(cevap));
    return b;
  }


  async function havuzGuncelle() {
    const yer = document.getElementById("havuz");
    try {
      const h = (await (await fetch("/health")).json()).havuz;
      if (!h) return;
      yer.textContent = `Örnek havuzu: ${h.golden} doğrulanmış soru, ${h.onayli} onaylı cevap.`;
    } catch (e) {
      yer.textContent = "";
    }
  }

  const KARAR_METNI = {
    eklendi: "✓ Onaylandı. Benzer sorularda örnek olarak kullanılacak.",
    guncellendi: "✓ Onaylandı. Bu sorunun örneği yeni SQL ile güncellendi.",
    golden_degismez: "✓ Onaylandı. Bu soru zaten doğrulanmış örnekler arasında.",
    cikarildi: "Not edildi. Daha önce onaylanan örnek havuzdan çıkarıldı.",
  };

  function degerlendirme(cevap) {
    const kutu = el("div", "degerlendir");
    if (!cevap.id) return kutu;
    kutu.append(el("span", null, "Bu cevap doğru mu?"));
    const dogruB = el("button", "secim", "Doğru");
    const yanlisB = el("button", "secim", "Yanlış");
    dogruB.type = yanlisB.type = "button";
    if (!cevap.hata) kutu.append(dogruB);
    kutu.append(yanlisB);
    let sorun = null;

    async function gonderKarar(dogru) {
      dogruB.disabled = yanlisB.disabled = true;
      try {
        const y = await fetch("/feedback", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: cevap.id, dogru }),
        });
        const j = await y.json();
        if (!y.ok) throw new Error(j.detail || `HTTP ${y.status}`);
        const metin = KARAR_METNI[j.havuz] ||
          (dogru ? KARAR_METNI.eklendi : "Not edildi. Bu cevap örnek olarak kullanılmayacak.");
        kutu.replaceChildren(el("span", dogru ? "karar onay" : "karar ret", metin));
        havuzGuncelle();
      } catch (e) {
        dogruB.disabled = yanlisB.disabled = false;
        if (sorun) sorun.remove();
        sorun = el("span", "karar sorun", "Kaydedilemedi: " + e.message);
        kutu.append(sorun);
      }
    }

    dogruB.addEventListener("click", () => gonderKarar(true));
    yanlisB.addEventListener("click", () => gonderKarar(false));
    return kutu;
  }

  function sonucuYaz(kayit, cevap) {
    const saniye = sayiBicim.format(cevap.sure_sn);
    const deneme = cevap.deneme > 1 ? `, ${cevap.deneme} denemede` : "";
    kayit.append(el("p", "bilgi", `${saniye} saniyede${deneme} hesaplandı.`));

    if (cevap.hata) {
      kayit.append(el("p", "hata", `Bu soru çalıştırılamadı: ${cevap.hata}`));
    } else if (!cevap.satirlar.length) {
      kayit.append(el("p", "not", "Sorgu çalıştı ama sonuç boş döndü. Tarih aralığını değiştirerek tekrar sormayı dene."));
    } else if (cevap.satirlar.length === 1 && cevap.kolonlar.length === 1) {
      const kutu = el("div", "tek-deger");
      kutu.append(el("strong", null, bicimle(cevap.satirlar[0][0])));
      kutu.append(el("span", null, cevap.kolonlar[0]));
      kayit.append(kutu);
    } else {
      const kap = el("div", "tablo-kap");
      const tablo = el("table");
      const sayisal = cevap.kolonlar.map((_, i) => cevap.satirlar.every(r => r[i] === null || typeof r[i] === "number"));
      const bas = el("tr");
      cevap.kolonlar.forEach((k, i) => bas.append(el("th", sayisal[i] ? "sayi" : null, k)));
      const thead = el("thead"); thead.append(bas); tablo.append(thead);
      const govde = el("tbody");
      cevap.satirlar.forEach(r => {
        const tr = el("tr");
        r.forEach((v, i) => tr.append(el("td", sayisal[i] ? "sayi" : null, bicimle(v))));
        govde.append(tr);
      });
      tablo.append(govde);
      kap.append(tablo);
      const grafik = grafikCiz(cevap);
      if (grafik) kayit.append(grafik);
      kayit.append(kap);
      kayit.append(indirmeDugmesi(cevap));
      if (cevap.kesildi) kayit.append(el("p", "not", "İlk 200 satır gösteriliyor."));
    }
    kayit.append(degerlendirme(cevap));
    kayit.append(nasilHesaplandi(cevap));
  }

  async function sor(soru) {
    const kayit = el("article", "kayit");
    kayit.append(el("h2", null, soru));
    const bekle = el("div", "bekle");
    kayit.append(bekle);
    kayitlar.prepend(kayit);

    gonder.disabled = true;
    gonder.textContent = "Hesaplanıyor…";
    try {
      const yanit = await fetch("/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ soru }),
      });
      bekle.remove();
      if (!yanit.ok) {
        kayit.append(el("p", "hata", `Soru gönderilemedi (HTTP ${yanit.status}). Soru 3 ile 500 karakter arasında olmalı.`));
        return;
      }
      sonucuYaz(kayit, await yanit.json());
    } catch (e) {
      bekle.remove();
      kayit.append(el("p", "hata", "Bir hata oluştu: " + e.message));
    } finally {
      gonder.disabled = false;
      gonder.textContent = "Sor";
    }
  }

  form.addEventListener("submit", e => {
    e.preventDefault();
    const soru = girdi.value.trim();
    if (soru.length < 3 || gonder.disabled) return;
    sor(soru);
    girdi.value = "";
  });

  document.querySelectorAll(".ornek").forEach(b =>
    b.addEventListener("click", () => { if (!gonder.disabled) sor(b.textContent); })
  );

  havuzGuncelle();
  girdi.focus();
</script>
</body>
</html>
