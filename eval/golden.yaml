- id: q055
  soru: "Geçen yıl kaç müşteri ilk siparişini verdi?"
  tur: tuzak
  set: test
  sql: |
    WITH ilk AS (
      SELECT c.customer_unique_id, MIN(o.order_purchase_timestamp) AS ilk_siparis
      FROM customers c JOIN orders o USING (customer_id)
      GROUP BY 1
    )
    SELECT COUNT(*) AS yeni_musteri FROM ilk
    WHERE ilk_siparis >= '2017-01-01' AND ilk_siparis < '2018-01-01';

- id: q056
  soru: "Sipariş başına kalem sayısının dağılımı nedir (1 kalemli, 2 kalemli...)?"
  tur: cok_adimli
  set: test
  sql: |
    WITH k AS (SELECT order_id, COUNT(*) AS kalem FROM order_items GROUP BY 1)
    SELECT kalem, COUNT(*) AS siparis FROM k GROUP BY 1 ORDER BY 1;

- id: q057
  soru: "Teslim edilen siparişlerin yüzde kaçının tutarı ortalama sipariş tutarının üstünde?"
  tur: cok_adimli
  set: test
  sql: |
    WITH t AS (
      SELECT o.order_id, SUM(oi.price) AS tutar
      FROM orders o JOIN order_items oi USING (order_id)
      WHERE o.order_status = 'delivered'
      GROUP BY 1
    )
    SELECT 100.0 * AVG(CASE WHEN tutar > (SELECT AVG(tutar) FROM t) THEN 1 ELSE 0 END) AS yuzde
    FROM t;

- id: q058
  soru: "2017'de her ay sipariş sayısı bir önceki aya göre yüzde kaç değişti?"
  tur: cok_adimli
  set: test
  sql: |
    WITH a AS (
      SELECT date_trunc('month', order_purchase_timestamp) AS ay, COUNT(*) AS siparis
      FROM orders
      WHERE order_purchase_timestamp >= '2017-01-01' AND order_purchase_timestamp < '2018-01-01'
      GROUP BY 1
    )
    SELECT ay, siparis,
           100.0 * (siparis - LAG(siparis) OVER (ORDER BY ay)) / LAG(siparis) OVER (ORDER BY ay) AS degisim_yuzde
    FROM a ORDER BY ay;

