- id: q047
  soru: "Siparişler ortalama kaç saatte onaylanıyor?"
  tur: zaman
  set: test
  sql: |
    SELECT AVG(EXTRACT(EPOCH FROM order_approved_at - order_purchase_timestamp) / 3600) AS saat
    FROM orders WHERE order_approved_at IS NOT NULL;

- id: q048
  soru: "En az 10 siparişi olan satıcılar arasında, siparişleri kargoya vermesi ortalamada en uzun süren 5 satıcı hangileri?"
  tur: zaman
  set: test
  sql: |
    WITH s AS (
      SELECT DISTINCT oi.seller_id, o.order_id, o.order_purchase_timestamp, o.order_delivered_carrier_date
      FROM order_items oi JOIN orders o USING (order_id)
      WHERE o.order_delivered_carrier_date IS NOT NULL
    )
    SELECT seller_id,
           AVG(EXTRACT(EPOCH FROM order_delivered_carrier_date - order_purchase_timestamp) / 86400) AS ortalama_gun
    FROM s
    GROUP BY 1 HAVING COUNT(*) >= 10
    ORDER BY 2 DESC LIMIT 5;

- id: q049
  soru: "Yıllara göre ortalama sepet tutarı nasıl değişti?"
  tur: zaman
  set: test
  sql: |
    WITH t AS (
      SELECT o.order_id, EXTRACT(YEAR FROM o.order_purchase_timestamp)::int AS yil, SUM(oi.price) AS tutar
      FROM orders o JOIN order_items oi USING (order_id)
      WHERE o.order_status = 'delivered'
      GROUP BY 1, 2
    )
    SELECT yil, AVG(tutar) AS ortalama_sepet FROM t GROUP BY 1 ORDER BY 1;

